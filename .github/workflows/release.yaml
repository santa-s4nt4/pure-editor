name: Build and Release (macOS & iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS の実行環境（割り当て待ちが長い場合は切り替え）'
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15

# latest-build を更新する実行は、ブランチごとに最新の1件だけ残します。
concurrency:
  group: pure-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # Releasesの作成・ファイルアップロードに必須

jobs:
  build-and-release:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    # 実行開始後の上限です。ランナーの割り当て待ちには適用されません。
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner and Xcode versions
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Setup Rust (macOS & iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # 異なる macOS / SDK でコンパイルしたキャッシュを混ぜません。
          shared-key: ${{ inputs.runner || 'macos-26' }}

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --cache=false

      - name: Build frontend once for macOS and iOS
        run: |
          npm run build
          test -s dist/index.html

      # ==========================================
      # 1. macOS App (.app -> pure-macos.zip)
      # ==========================================
      - name: Build Tauri macOS App
        run: npm run tauri build -- --bundles app --ci --config '{"build":{"beforeBuildCommand":""}}'

      - name: Ad-hoc Sign and Package macOS ZIP
        run: |
          APP_PATH=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -type d -name "*.app" -print -quit)
          test -n "$APP_PATH"
          echo "Found macOS app at: $APP_PATH"

          # Apple Developer ID が不要なアドホック署名を付与
          codesign --force --deep --sign - "$APP_PATH"

          # シンボリックリンクや実行権限を保持したまま圧縮
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" pure-macos.zip

      # ==========================================
      # 2. iOS App (Unsigned .ipa for SideStore/AltStore)
      # ==========================================
      - name: Initialize iOS Xcode Project
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npm run tauri ios init -- --ci
          fi

      # ios init で生成された Xcode のアイコンにも、配布元画像を反映します。
      - name: Apply pure app icons to iOS project
        run: |
          npm run tauri icon -- public/pure.png
          cmp src-tauri/icons/ios/AppIcon-512@2x.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Build Unsigned iOS IPA
        run: |
          # Tauri CLI が Xcode の Rust ビルドフェーズ向け設定サーバーを提供します。
          npm run tauri ios build -- --ci --no-sign --target aarch64 --config '{"build":{"beforeBuildCommand":""}}'

          IOS_IPA=$(find src-tauri/gen/apple/build/arm64 -maxdepth 1 -name "*.ipa" -type f -print -quit)
          test -n "$IOS_IPA"
          cp "$IOS_IPA" pure-ios-unsigned.ipa
          ls -lh pure-ios-unsigned.ipa

      # ==========================================
      # 3. GitHub Releases へ両方アップロード
      # ==========================================
      - name: Upload macOS ZIP and iOS IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 並列制御導入前の再実行や、古いコミットの手動実行も公開しません。
          LATEST_MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$GITHUB_SHA" != "$LATEST_MAIN_SHA" ]; then
            echo "::notice::main が更新されたため、このコミットの配布をスキップします。"
            exit 0
          fi
          TAG="latest-build"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pure-macos.zip pure-ios-unsigned.ipa --clobber
          else
            gh release create "$TAG" pure-macos.zip pure-ios-unsigned.ipa \
              --title "pure (Latest macOS & iOS Build)" \
              --notes "mainブランチから自動ビルドされた最新のmacOS版（pure-macos.zip）およびiOS未署名版（pure-ios-unsigned.ipa）です。"
          fi
