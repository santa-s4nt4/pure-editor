name: Build and Release (macOS & iOS)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Mac ビルド環境（割り当て時間は GitHub 側の状況に依存）'
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-26-intel, macos-26, macos-15]
      platform:
        description: 'both は配布まで実行。片方だけの場合は成果物の検証のみ'
        type: choice
        default: both
        options: [both, macos, ios]

concurrency:
  group: pure-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build frontend (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Validate workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          ARCHIVE="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          CHECKSUMS="actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          BASE="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --location --retry 3 "$BASE/$ARCHIVE" --output "$RUNNER_TEMP/$ARCHIVE"
          curl --fail --location --retry 3 "$BASE/$CHECKSUMS" --output "$RUNNER_TEMP/$CHECKSUMS"
          (cd "$RUNNER_TEMP" && sha256sum --check --ignore-missing "$CHECKSUMS")
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck=
          bash -n scripts/ci/build-native.sh
          bash -n scripts/ci/publish-release.sh
      - run: npm ci
      - name: Test app and release integrity
        run: |
          npm test -- --cache=false
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests/ci -v
      - name: Build portable frontend once
        run: |
          npm run build
          python3 scripts/ci/artifacts.py stamp-frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: dist/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  macos:
    name: macOS
    needs: verify
    if: ${{ !inputs.platform || inputs.platform == 'both' || inputs.platform == 'macos' }}
    uses: ./.github/workflows/native-build.yaml
    with:
      platform: macos
      runner: ${{ inputs.runner || 'macos-15-intel' }}

  ios:
    name: iOS
    needs: verify
    if: ${{ !inputs.platform || inputs.platform == 'both' || inputs.platform == 'ios' }}
    uses: ./.github/workflows/native-build.yaml
    with:
      platform: ios
      runner: ${{ inputs.runner || 'macos-15-intel' }}

  publish:
    name: Summarize and publish verified pair (Linux)
    needs: [verify, macos, ios]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Summarize each stage
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          IOS_RESULT: ${{ needs.ios.result }}
        run: |
          {
            echo '### pure build results'
            echo "Frontend / tests: $VERIFY_RESULT"
            echo "macOS: $MACOS_RESULT"
            echo "iOS: $IOS_RESULT"
            echo 'Native builds that succeeded remain in this run’s Artifacts for 7 days.'
            echo 'latest-build is updated only when both platforms succeed at the same commit.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: ${{ needs.macos.result == 'success' && needs.ios.result == 'success' }}
      - uses: actions/download-artifact@v4
        if: ${{ needs.macos.result == 'success' && needs.ios.result == 'success' }}
        with:
          pattern: native-*
          merge-multiple: true
          path: release/
      - name: Verify commit and publish both packages
        if: ${{ needs.macos.result == 'success' && needs.ios.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/publish-release.sh
