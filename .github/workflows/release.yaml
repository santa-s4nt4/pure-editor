name: Build and Release (macOS & iOS)

on:
  push:
    branches:
      - main
  workflow_dispatch: # GitHubのActionsタブから手動実行も可能

permissions:
  contents: write # Releasesの作成・ファイルアップロードに必須

jobs:
  build-and-release:
    runs-on: macos-15 # Apple Silicon + macOS 15 / Xcode 環境
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Setup Rust (macOS & iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      # ==========================================
      # 1. macOS App (.app -> pure-macos.zip)
      # ==========================================
      - name: Build Tauri macOS App
        run: npm run tauri build -- --bundles app

      - name: Ad-hoc Sign and Package macOS ZIP
        run: |
          APP_PATH=$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found macOS app at: $APP_PATH"

          # Apple Developer ID が不要なアドホック署名を付与
          codesign --force --deep --sign - "$APP_PATH"

          # シンボリックリンクや実行権限を保持したまま圧縮
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" pure-macos.zip

      # ==========================================
      # 2. iOS App (Unsigned .ipa for SideStore/AltStore)
      # ==========================================
      - name: Initialize iOS Xcode Project
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            npm run tauri ios init -- --ci
          fi

      - name: Build Unsigned iOS IPA
        run: |
          # Tauri CLI が Xcode の Rust ビルドフェーズ向け設定サーバーを提供します。
          npm run tauri ios build -- --ci --no-sign --target aarch64

          IOS_IPA=$(find src-tauri/gen/apple/build/arm64 -maxdepth 1 -name "*.ipa" -type f -print -quit)
          test -n "$IOS_IPA"
          cp "$IOS_IPA" pure-ios-unsigned.ipa
          ls -lh pure-ios-unsigned.ipa

      # ==========================================
      # 3. GitHub Releases へ両方アップロード
      # ==========================================
      - name: Upload macOS ZIP and iOS IPA to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="latest-build"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" pure-macos.zip pure-ios-unsigned.ipa --clobber
          else
            gh release create "$TAG" pure-macos.zip pure-ios-unsigned.ipa \
              --title "pure (Latest macOS & iOS Build)" \
              --notes "mainブランチから自動ビルドされた最新のmacOS版（pure-macos.zip）およびiOS未署名版（pure-ios-unsigned.ipa）です。"
          fi
